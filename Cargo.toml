[workspace]
# xtask (WI-3) and its tests; the example plugin is listed explicitly (ADR 0023 item 4), so a
# C example directory without a Cargo.toml is never a member.
members = [
    "crates/*",
    "examples/plugins/wander",
    "examples/plugins/hover",
    "examples/plugins/radar",
    "examples/plugins/bearing",
    "examples/plugins/dispatch",
    "examples/plugins/net-jsonl",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
# Placeholder until a remote exists (ASM-003).
repository = "https://example.invalid/umbra"

[workspace.dependencies]
anyhow = "1"
# HTTP router and WebSocket upgrade (umbra-server only; ADR 0025). `matchit` (MIT AND BSD-3-Clause) comes with it.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "ws", "tokio"] }
# Compiles C against umbra_plugin_api.h (ADR 0023 item 3): dev-only in umbra-plugin-host (tests), and
# in xtask, which builds the C example plugin for `build-plugins`.
cc = "1.2"
# Query-string parsing for repeated and comma-separated array parameters (umbra-server; ADR 0026, m5).
form_urlencoded = "1.2.2"
# `Sink`/`Stream` for the stream loop (umbra-server; ADR 0025).
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hecs = { version = "0.11.2", default-features = false }
# Opens plugin libraries with explicit load flags (umbra-plugin-host only; ADR 0023 item 1, ASM-133).
libloading = "0.9.0"
proptest = "1"
semver = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# UDP sockets with multicast and reuse options (umbra-net-dis only, used from M6 WI-15; ADR 0034, H5).
socket2 = "0.6.5"
# xtask only (ASM-024): parse crate roots and manifests instead of scanning text.
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing"] }
thiserror = "2"
# Async runtime, owned by umbra-server (ADR 0025). `test-util` is a dev feature, enabled per crate.
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
# Client side of the stream tests (dev only; ADR 0025). Versions match what axum 0.8.9 uses.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing = { version = "0.1.44", default-features = false }
# OpenAPI 3.1 from Rust types (D-11). Never enable `preserve_order` (output order must be deterministic).
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Short pedantic allow-list (ASM-012).
module_name_repetitions = "allow"   # umbra-* crate/type names repeat module names by design
must_use_candidate = "allow"        # too noisy for small value types
missing_errors_doc = "allow"        # errors are documented by their thiserror enums
