# dis_a: site 1, application 1, DIS v7 over unicast UDP on 127.0.0.1:47001, peer on 47002. See ../README.md.
schema_version = 1

[scenario]
name = "dis_a"
seed = 1
tick_rate_hz = 30
clock = "realtime"
duration_s = 10.0
template_paths = ["../templates"]

[[network_adapters]]
adapter = "umbra.net.dis"
name = "dis"
params = { site = 1, application = 1, bind = "127.0.0.1:47001", destinations = ["127.0.0.1:47002"] }
[network_adapters.publish]
heartbeat_s = 1.0
[network_adapters.ghosts]
timeout_s = 3.0

[[entities]]
template = "tank.mbt_generic"
name = "a-tank"
force = "friendly"
position = { lat_deg = 52.0, lon_deg = 4.0 }
heading_deg = 90.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 14.0
waypoints = [
  { lat_deg = 52.0, lon_deg = 4.0073 },
  { lat_deg = 52.0045, lon_deg = 4.0073 },
  { lat_deg = 52.0045, lon_deg = 4.0 },
  { lat_deg = 52.0, lon_deg = 4.0 },
]

[[entities]]
template = "truck.cargo"
name = "a-truck"
force = "friendly"
position = { lat_deg = 52.01, lon_deg = 4.0 }
heading_deg = 0.0
speed_mps = 0.0
