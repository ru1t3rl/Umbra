# dis_b: site 1, application 2, DIS v7 over unicast UDP on 127.0.0.1:47002, peer on 47001. See ../README.md.
schema_version = 1

[scenario]
name = "dis_b"
seed = 2
tick_rate_hz = 30
clock = "realtime"
duration_s = 10.0
template_paths = ["../templates"]

[[network_adapters]]
adapter = "umbra.net.dis"
name = "dis"
params = { site = 1, application = 2, bind = "127.0.0.1:47002", destinations = ["127.0.0.1:47001"] }
[network_adapters.publish]
heartbeat_s = 1.0
[network_adapters.ghosts]
timeout_s = 3.0

[[entities]]
template = "tank.mbt_generic"
name = "b-tank"
force = "opposing"
position = { lat_deg = 52.05, lon_deg = 4.1 }
heading_deg = 90.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 14.0
waypoints = [
  { lat_deg = 52.05, lon_deg = 4.1073 },
  { lat_deg = 52.0545, lon_deg = 4.1073 },
  { lat_deg = 52.0545, lon_deg = 4.1 },
  { lat_deg = 52.05, lon_deg = 4.1 },
]

[[entities]]
template = "truck.cargo"
name = "b-truck"
force = "opposing"
position = { lat_deg = 52.06, lon_deg = 4.1 }
heading_deg = 0.0
speed_mps = 0.0
