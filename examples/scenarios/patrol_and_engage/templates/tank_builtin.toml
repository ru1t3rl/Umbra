# Based on the spec section 7.1 template (the built-in graph, the visual sensor and its `aggression`
# parameter), but it now differs from 7.1: `fov_deg = 360.0` (7.1: 120) and `engage_range_m = 1500.0`
# (7.1 leaves the graph default, 3000 m), so red leaves blue-2's engage range, not its fov (WI-16).
schema_version = 1
id = "example.tank.builtin"
extends = "example.ground_vehicle"
description = "Blue tank that uses the built-in patrol-and-engage graph"

[[sensors]]
kind = "builtin.visual"
params = { range_m = 3000.0, fov_deg = 360.0 }

[behavior]
ref = "builtin.fsm.patrol_and_engage"
params = { aggression = 0.7, engage_range_m = 1500.0 }
