# The M3 acceptance scenario (patrol-and-engage): a blue tank patrols east along a two-leg route;
# a red truck drives west past it; the tank notices it (builtin.visual), engages (a tree with an
# embedded FSM and a reusable subgraph, see behaviors/), fires (recorded, not applied until M5),
# and resumes its patrol once the truck has left. A second blue tank uses the built-in graph
# `builtin.fsm.patrol_and_engage` through the spec 7.1 style template.
#
# Provenance: written for M3 step 4 (test-engineer); run and tuned in WI-16 (review round: the
# sensors' fov is 360 degrees and blue-2's engage range is 1500 m, so a blue loses red by RANGE, not
# at the fov edge). Real ticks at 30 Hz (seed 7):
#   blue-1: first contact 328, approach (`move_to`) 634, first `Fire` 1130, last `Fire` 2347
#           (11 shots), patrol resumed 3488 (red 900.8 m away, engage range 900 m).
#   blue-2: contact and first `Fire` at tick 1, last `Fire` 3643 (31 shots), patrol resumed 3685
#           (red 1501.1 m away, engage range 1500 m, off-axis 156 deg, irrelevant at fov 360).
#
#   blue-1   start (0, 0)      heading east   10 m/s   route (50, 0) then (800, 0)
#   red-1    start (1500, 200) heading west   20 m/s   route to (-9000, 200)
#   blue-2   start (400, 800)  heading east   10 m/s   route to (4000, 800)  [built-in graph]
#
# Coordinates: lat = 52 + north / 111267, lon = 4 + east / 68684, rounded to 7 decimals (1 cm).
schema_version = 1

[scenario]
name = "patrol_and_engage"
seed = 7
tick_rate_hz = 30
clock = "afap"
duration_s = 140.0                # 4200 ticks; `umbra run --ticks N` overrides it
template_paths = ["templates", "behaviors"]

[terrain]
provider = "builtin.terrain.flat"
params = { height_m = 0.0 }

[[entities]]
template = "example.tank.blue"
name = "blue-1"
group = "blue"
force = "blue"
position = { lat_deg = 52.0, lon_deg = 4.0 }
heading_deg = 90.0
speed_mps = 10.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 10.0
waypoints = [
  { lat_deg = 52.0, lon_deg = 4.0007280 },
  { lat_deg = 52.0, lon_deg = 4.0116475 },
]

[[entities]]
template = "example.truck.red"
name = "red-1"
group = "red"
force = "red"
position = { lat_deg = 52.0017975, lon_deg = 4.0218391 }
heading_deg = 270.0
speed_mps = 20.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 20.0
waypoints = [
  { lat_deg = 52.0017975, lon_deg = 3.8689651 },
]

[[entities]]
template = "example.tank.builtin"
name = "blue-2"
group = "blue"
force = "blue"
position = { lat_deg = 52.0071899, lon_deg = 4.0058238 }
heading_deg = 90.0
speed_mps = 10.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 10.0
waypoints = [
  { lat_deg = 52.0071899, lon_deg = 4.0582377 },
]
