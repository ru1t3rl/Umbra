# Generic tracked or wheeled ground vehicle. Concrete templates extend it.
schema_version = 1
id = "ground_vehicle.base"
description = "Generic ground vehicle with the spec section 7.1 kinematic limits"

[motion]
model = "builtin.ground.kinematic"
params = { max_speed_mps = 18.0, max_turn_rate_dps = 40.0, max_accel_mps2 = 2.5 }
