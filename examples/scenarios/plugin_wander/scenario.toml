# The M4 acceptance scenario (spec section 17, M4 acceptance 1): the example plugin `example-wander`
# (behavior `example.behavior.wander`) drives entities next to a built-in behavior.
#
#   wander-direct   template ref = "example.behavior.wander" (5 m/s, new heading every 10 s)  [batched]
#   wander-graph    file graph calling the plugin as a `subgraph`: speed bound from the graph's
#                   `speed` key (12 m/s), output `turns` bound to a key, inside a 20 s `timeout`
#   patrol-builtin  `builtin.fsm.patrol_and_engage` along a route east                      [unbatched]
#
# There is no `plugin_paths` here (ASM-113): a build directory is not portable. Run it with
#   cargo xtask build-plugins
#   umbra run examples/scenarios/plugin_wander/scenario.toml --plugin-path target/plugins
#
# Flat terrain; the walks stay within about a kilometer of their starts (at most 12 m/s for 60 s).
# Coordinates: lat = 52 + north / 111267, lon = 4 + east / 68684, rounded to 7 decimals (1 cm).
schema_version = 1

[scenario]
name = "plugin_wander"
seed = 7
tick_rate_hz = 30
clock = "afap"
duration_s = 60.0                 # 1800 ticks; `umbra run --ticks N` overrides it
template_paths = ["templates", "behaviors"]

[terrain]
provider = "builtin.terrain.flat"
params = { height_m = 0.0 }

[[entities]]
template = "example.wander.direct"
name = "wander-direct"
position = { lat_deg = 52.0, lon_deg = 4.0 }
heading_deg = 90.0
speed_mps = 5.0

[[entities]]
template = "example.wander.graph"
name = "wander-graph"
position = { lat_deg = 52.0, lon_deg = 4.0218391 }
heading_deg = 90.0
speed_mps = 5.0

[[entities]]
template = "example.wander.patrol"
name = "patrol-builtin"
position = { lat_deg = 52.0179747, lon_deg = 4.0 }
heading_deg = 90.0
speed_mps = 10.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 10.0
waypoints = [
  { lat_deg = 52.0179747, lon_deg = 4.0116475 },
]
