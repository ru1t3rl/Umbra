# Wander through the plugin behavior, called as a subgraph (REQ-B-9): its `speed_mps` is bound to
# this graph's `speed` key before every tick, its output `turns` is copied into the key `turns`
# after every tick, and a `timeout` ends each walk after 45 s (the plugin is halted and starts a
# fresh walk on the next tick).
schema_version = 1
id = "example.behavior.wander_graph"
version = "1.0.0"
description = "Wander at `speed` through the wander plugin, a fresh walk every 45 s"
root = "walk"

[interface]
params = { speed = { type = "number", exclusiveMinimum = 0, default = 12.0 } }
outputs = { turns = { type = "integer", from = "turns" } }
result = "Running while walking; Failure on the tick a walk times out"

[blackboard]
turns = "integer"

[nodes.walk]
type = "timeout"
duration_s = 45.0
child = "wander"

[nodes.wander]
type = "subgraph"
ref = "example.behavior.wander"
version = "^0.1"
# `{ key = .. }`: bound before every tick (the plugin declares `speed_mps` bindable); literals as usual.
params = { speed_mps = { key = "speed" }, turn_every_s = 5.0 }
outputs = { turns = "turns" }
