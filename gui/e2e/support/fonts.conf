<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pins font rasterization for the Playwright screenshot tests on Linux (ASM-932). Web-font text ignores
     the system settings, but the native <select> text follows the system hinting and subpixel settings
     (fontconfig, desktop), which differ per machine. This file replaces the system fontconfig (it does not
     include it: the distribution's rules re-apply their own hinting) and fixes hintstyle, antialiasing and
     subpixel order. The directories are only for glyph fallback; every shipped font is a bundled web font. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">umbra-e2e-fontconfig</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
