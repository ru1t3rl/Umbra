<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  function Demo() {
    var a = React.useState(true), b = React.useState(false);
    return h(F, null,
      h(V.Toggle, { checked: a[0], onChange: a[1], label: 'Show historic tracks' }),
      h(V.Toggle, { checked: b[0], onChange: b[1], label: 'Record session' }),
      h(V.Toggle, { checked: true, disabled: true, label: 'Terrain loaded' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
