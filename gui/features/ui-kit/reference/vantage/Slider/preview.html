<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row" style="align-items:flex-start"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  function Demo() {
    var r = React.useState(2), z = React.useState(60);
    var rates = ['1:1', '1:2', '1:4', '1:8', '1:16'];
    return h(F, null,
      h(V.Slider, { label: 'Time rate', min: 0, max: 4, step: 1, value: r[0], onChange: function (e) { r[1](+e.target.value); }, format: function (v) { return rates[v]; } }),
      h(V.Slider, { label: 'Update rate', min: 1, max: 120, value: z[0], onChange: function (e) { z[1](+e.target.value); }, format: function (v) { return v + ' Hz'; } }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
