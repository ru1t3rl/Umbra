<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chip — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  function Rates() {
    var s = React.useState('1:4'), rate = s[0], setRate = s[1];
    return h(V.ChipGroup, { label: 'Time rate' }, ['1:1', '1:2', '1:4', '1:8'].map(function (r) {
      return h(V.Chip, { key: r, selected: rate === r, onClick: function () { setRate(r); } }, r);
    }));
  }
  function Layers() {
    var s = React.useState({ tracks: true, grid: false }), on = s[0], set = s[1];
    return h(V.ChipGroup, { label: 'Map layers' },
      h(V.Chip, { glass: true, icon: 'timeline', selected: on.tracks, onClick: function () { set(Object.assign({}, on, { tracks: !on.tracks })); } }, 'Tracks'),
      h(V.Chip, { glass: true, icon: 'grid_on', selected: on.grid, onClick: function () { set(Object.assign({}, on, { grid: !on.grid })); } }, 'MGRS grid'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null, h(Rates), h(Layers)));
</script>
</body>
</html>
