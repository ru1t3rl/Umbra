<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row" style="align-items:flex-start"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(V.TextField, { label: 'Callsign', placeholder: 'e.g. Alpha 1-1', help: 'Shown on the map label.' }),
    h(V.TextField, { label: 'Position (MGRS)', mono: true, defaultValue: '31U FT 12345 67890' }),
    h(V.TextField, { label: 'March speed', mono: true, defaultValue: '140 km/h', invalid: true, help: 'Exceeds the platform maximum of 65 km/h.' })
  ));
</script>
</body>
</html>
