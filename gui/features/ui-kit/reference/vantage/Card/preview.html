<!-- @dsCard group="Containers" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row" style="align-items:stretch; background: var(--surface-1);"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(V.Card, { title: '2nd Mechanised Brigade', subtitle: '48 entities · 3 battalions', style: { width: 260 } },
      h('div', { className: 'vt-row', style: { padding: 'var(--space-3) 0 0', gap: 'var(--space-2)' } },
        h(V.AffiliationTag, { affiliation: 'friend' }, 'BDE'), h(V.Badge, { tone: 'success' }, 'Running'))),
    h(V.Card, { level: 3, title: 'Red Force reserve', subtitle: '12 entities · held' },
      h('div', { className: 'vt-row', style: { padding: 'var(--space-3) 0 0', gap: 'var(--space-2)' } },
        h(V.AffiliationTag, { affiliation: 'hostile' }, 'BN'), h(V.Badge, { tone: 'info' }, 'Paused'))),
    h(V.Card, { variant: 'outline', title: 'Add formation', subtitle: 'From template or empty' })
  ));
</script>
</body>
</html>
