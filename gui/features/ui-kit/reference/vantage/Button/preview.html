<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(V.Button, { variant: 'filled', icon: 'play_arrow' }, 'Start exercise'),
    h(V.Button, null, 'Assign route'),
    h(V.Button, { variant: 'outline' }, 'Export log'),
    h(V.Button, { variant: 'ghost' }, 'Cancel'),
    h(V.Button, { variant: 'danger', icon: 'delete' }, 'Remove entity'),
    h(V.Button, { variant: 'outline', icon: 'settings', 'aria-label': 'Settings' }),
    h(V.Button, { size: 'sm' }, 'Small'),
    h(V.Button, { disabled: true }, 'Disabled')
  ));
</script>
</body>
</html>
