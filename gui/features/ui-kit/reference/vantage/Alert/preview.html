<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-col"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(V.Alert, { tone: 'danger', title: 'Route rejected', action: h(V.Button, { size: 'sm', variant: 'ghost' }, 'Edit route') }, 'The destination lies outside the terrain database.'),
    h(V.Alert, { tone: 'warning', title: 'Federate latency 480 ms', action: h(V.Button, { size: 'sm', variant: 'ghost' }, 'Details') }, 'Updates from the flight simulator are arriving late. Positions may lag.'),
    h(V.Alert, { tone: 'success', title: 'Recording started' }, 'Session is being written to northern-shield-run-3.'),
    h(V.Alert, { tone: 'info', title: '12 entities paused' }, 'Resume the run to continue their orders.')
  ));
</script>
</body>
</html>
