<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" class="vt-row"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(V.Badge, { tone: 'success' }, 'Running'),
    h(V.Badge, { tone: 'info' }, 'Paused'),
    h(V.Badge, { tone: 'warning' }, 'Degraded'),
    h(V.Badge, { tone: 'danger' }, 'Faulted'),
    h(V.Badge, null, 'Stale'),
    h(V.Badge, { tone: 'danger' }, 'Destroyed')
  ));
</script>
</body>
</html>
