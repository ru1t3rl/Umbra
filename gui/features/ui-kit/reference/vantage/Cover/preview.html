<!doctype html>

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-0); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .azure { fill: var(--azure); }
  .deep { fill: var(--surface-3); }
  .cyan { fill: var(--cyan); }
  .glass { fill: var(--glass); stroke: var(--glass-stroke); stroke-width: 1; }
  .plus { stroke: var(--cyan); stroke-width: 1.5; fill: none; }
  .lg { rx: var(--radius-lg); }
  .sm { rx: var(--radius-sm); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .9; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
