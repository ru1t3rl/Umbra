<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet">
<style></style></head>
<body>
<div id="root" style="padding: var(--space-4)"></div>
<script>
  var V = window.Vantage, h = React.createElement, F = React.Fragment;
  function Demo() {
    var s = React.useState('orbat');
    return h(V.Tabs, { value: s[0], onChange: s[1], items: [
      { value: 'orbat', label: 'Order of battle', count: 48 },
      { value: 'orders', label: 'Orders', count: 6 },
      { value: 'events', label: 'Event log', count: 1203 },
      { value: 'settings', label: 'Settings' } ] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
