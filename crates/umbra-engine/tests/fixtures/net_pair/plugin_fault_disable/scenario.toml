# net_plugin_fault_disable. See ../README.md.
schema_version = 1

[scenario]
name = "net_plugin_fault_disable"
seed = 3
tick_rate_hz = 30
clock = "stepped"
duration_s = 60.0
template_paths = ["../templates"]
on_plugin_fault = "disable_capability"

[[network_adapters]]
adapter = "test.network.net_panics_in_poll"
name = "left"
params = { panic_at_tick = 5 }

[[entities]]
template = "tank.mbt_generic"
name = "f-tank"
force = "blue"
position = { lat_deg = 52.0, lon_deg = 4.0 }
heading_deg = 90.0
speed_mps = 5.0
