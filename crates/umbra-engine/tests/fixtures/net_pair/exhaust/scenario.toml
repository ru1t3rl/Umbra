# net_exhaust. See ../README.md.
schema_version = 1

[scenario]
name = "net_exhaust"
seed = 3
tick_rate_hz = 30
clock = "stepped"
duration_s = 400.0
template_paths = ["../templates"]

[[network_adapters]]
adapter = "test.net.left"
name = "left"
[network_adapters.publish]
heartbeat_s = 1.0
[network_adapters.ghosts]
timeout_s = 3.0
[[network_adapters]]
adapter = "test.net.right"
name = "right"
[network_adapters.publish]
heartbeat_s = 1.0
[network_adapters.ghosts]
timeout_s = 3.0
[[entities]]
template = "tank.mbt_generic"
name = "c-tank"
force = "green"
position = { lat_deg = 52.1, lon_deg = 4.2 }
heading_deg = 90.0
[entities.route]
arrival_radius_m = 5.0
cruise_speed_mps = 14.0
waypoints = [
  { lat_deg = 52.1, lon_deg = 4.2073 },
  { lat_deg = 52.1045, lon_deg = 4.2073 },
  { lat_deg = 52.1045, lon_deg = 4.2 },
  { lat_deg = 52.1, lon_deg = 4.2 },
]

[[entities]]
template = "truck.cargo"
name = "c-truck"
force = "green"
position = { lat_deg = 52.11, lon_deg = 4.2 }
heading_deg = 0.0
speed_mps = 0.0
