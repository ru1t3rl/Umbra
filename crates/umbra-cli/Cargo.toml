[package]
name = "umbra-cli"
description = "Umbra command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
umbra-engine = { path = "../umbra-engine" }
umbra-server = { path = "../umbra-server", optional = true }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[features]
# `umbra serve` (M5 WI-17). Off: engine-only CLI, no tokio/axum in the build (REQ-S-1, REQ-G-1, D-1).
default = ["server"]
server = ["dep:umbra-server"]

[lints]
workspace = true

[[bin]]
name = "umbra"
path = "src/main.rs"
