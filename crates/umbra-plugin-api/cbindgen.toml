# cbindgen configuration for umbra_plugin_api.h (REQ-SDK-2, ADR 0019 R-M6, ADR 0023 item 2).
# Generate with `cargo xtask gen-header`; gate 11 runs `cargo xtask gen-header --check`.
language = "C"
style = "type"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
# The include guard UMBRA_PLUGIN_API_H is written here and closed at the end of `trailer`, because
# cbindgen's `include_guard` closes before the trailer, which would leave the macros and the closing
# brace of `extern "C"` outside the guard.
header = """/* SPDX-License-Identifier: MIT OR Apache-2.0 */

#ifndef UMBRA_PLUGIN_API_H
#define UMBRA_PLUGIN_API_H"""
autogen_warning = "/* Generated by cbindgen from crates/umbra-plugin-api; do not edit. Regenerate with `cargo xtask gen-header`. */"
documentation = true
documentation_style = "doxy"
# Before the generated items (R-M6): incomplete handle types, the 64-bit assert (ASM-120), UMBRA_EXPORT,
# and the C++ linkage guard (cbindgen's cpp_compat only wraps function declarations, and there are none).
after_includes = """

/* Opaque plugin-owned handles: incomplete types, the host never dereferences them. */
typedef struct UmbraBehavior UmbraBehavior;
typedef struct UmbraInstance UmbraInstance;

/* Umbra plugin ABI v0 supports 64-bit targets only (ADR 0019). */
#if defined(__cplusplus)
static_assert(sizeof(void *) == 8, "Umbra plugin ABI v0 supports 64-bit targets only");
#else
_Static_assert(sizeof(void *) == 8, "Umbra plugin ABI v0 supports 64-bit targets only");
#endif

/* Marks the one exported symbol of a C plugin: UMBRA_EXPORT const UmbraPluginDescriptor *
   umbra_plugin_entry(const UmbraHostApi *host) { ... } */
#if defined(_WIN32)
#  define UMBRA_EXPORT __declspec(dllexport)
#else
#  define UMBRA_EXPORT __attribute__((visibility("default")))
#endif

#if defined(__cplusplus)
extern "C" {
#endif"""
# After the generated items, so UmbraStr is declared (re-review RR-m1): UTF-8 string literals without the
# sizeof off-by-one or char/uint8_t sign warnings; the "" forces a literal argument.
trailer = """
/* The one exported symbol of a plugin (REQ-P-1): define it with UMBRA_EXPORT. Declared here so the
   compiler checks a C plugin's definition against the ABI's entry type. */
UMBRA_EXPORT const UmbraPluginDescriptor *umbra_plugin_entry(const UmbraHostApi *host);

/* UmbraStr from a string literal, as an expression (compound literal). */
#define UMBRA_STR(lit) ((UmbraStr){ (const uint8_t *)("" lit), sizeof(lit) - 1 })
/* UmbraStr from a string literal, as a static initializer. */
#define UMBRA_STR_INIT(lit) { (const uint8_t *)("" lit), sizeof(lit) - 1 }

#if defined(__cplusplus)
}  /* extern "C" */
#endif

#endif  /* UMBRA_PLUGIN_API_H */"""

[export]
# The crate exports no functions, so every type is listed (cbindgen emits only reachable items).
include = [
    "UmbraToken",
    "UmbraStr",
    "UmbraVec3",
    "UmbraQuat",
    "UmbraErrorSink",
    "UmbraHostApi",
    "UmbraPluginDescriptor",
    "UmbraCapability",
    "UmbraBehaviorVTable",
    "UmbraBehaviorBatch",
    "UmbraBehaviorItem",
    "UmbraEntityView",
    "UmbraContact",
    "UmbraIntent",
    "UmbraIntentSink",
    "UmbraValue",
    "UmbraValueSink",
    "UmbraPluginEntry",
]
# Opaque plugin-owned handles: declared as incomplete types in `after_includes` (R-M6).
exclude = ["UmbraBehavior", "UmbraInstance"]

[parse]
parse_deps = false
