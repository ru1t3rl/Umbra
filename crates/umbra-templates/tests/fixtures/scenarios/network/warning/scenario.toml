schema_version = 1

[scenario]
name = "network_warning"
seed = 7
tick_rate_hz = 30
duration_s = 10.0
template_paths = ["templates"]

[[entities]]
template = "veh.warn"
position = { lat_deg = 52.0, lon_deg = 4.0 }

[[network_adapters]]
adapter = "test.net.loopback"
name = "lb"
params = { port = 7 }

[network_adapters.ghosts]
timeout_s = 2.0
default_template = "veh.warn"
