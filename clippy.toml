# REQ-K-4 / ASM-013: determinism guards. A legitimate site needs a local
# #[expect(clippy::disallowed_methods, reason = "REQ-K-4: ...")] (or disallowed_types).
# Convention (ASM-012): #[allow] is itself linted (allow_attributes, allow_attributes_without_reason);
# use #[expect(..., reason = "...")] so a stale exception fails the build.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "REQ-K-4: wall clock is forbidden in simulation logic; use Clock" },
    { path = "std::time::Instant::now", reason = "REQ-K-4: wall clock is forbidden in simulation logic; use Clock" },
    { path = "std::time::SystemTime::elapsed", reason = "REQ-K-4: wall clock is forbidden in simulation logic; use Clock" },
    { path = "std::time::Instant::elapsed", reason = "REQ-K-4: wall clock is forbidden in simulation logic; use Clock" },
    { path = "std::thread::sleep", reason = "REQ-K-4: real-time waiting is forbidden in simulation logic; use Clock" },
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "REQ-K-4: iteration order is nondeterministic; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "REQ-K-4: iteration order is nondeterministic; use BTreeSet" },
    { path = "std::hash::RandomState", reason = "REQ-K-4: random hasher seeding is nondeterministic; use a fixed hasher or BTreeMap" },
    { path = "std::collections::hash_map::RandomState", reason = "REQ-K-4: random hasher seeding is nondeterministic; use a fixed hasher or BTreeMap" },
]
