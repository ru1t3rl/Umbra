# cargo-deny configuration (NFR-4, NFR-6, ADR 0001, ASM-020).
# Minimal list: only licenses the current tree uses (ASM-020). Candidates to add when a dependency needs
# them: Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC, Zlib.
# Add a license only in the PR that adds a dependency needing it, with a note.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
